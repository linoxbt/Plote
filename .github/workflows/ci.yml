name: ci
on:
  push:
  pull_request:

# Read-only token for every job (actions pinned by commit SHA; the tag is in the comment).
permissions:
  contents: read

jobs:
  # Unit tests, then the real WASMs built and run together on near-mock (tests/integration: an in-process engine, no
  # sandbox node or near-workspaces binaries needed).
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --target wasm32-unknown-unknown -p plote-estate -p plote-unit -p plote-musdc
      - run: cargo install cargo-near --version 0.22.0 --locked --no-default-features
      - name: build WASMs and run them together on near-mock
        run: |
          for c in contracts/unit contracts/musdc contracts/mocks/outlayer-mock contracts/estate; do
            cargo near build non-reproducible-wasm --manifest-path $c/Cargo.toml
          done
          cargo test --release --manifest-path tests/integration/Cargo.toml

  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: verifier
      # verifier/ is its own workspace (not in the root Cargo workspace), so the root fmt/clippy steps don't cover it.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target wasm32-wasip2

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            scripts/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web typecheck
      - run: pnpm -C web test
      - run: pnpm -C web build
      - run: pnpm -C scripts install --frozen-lockfile && pnpm -C scripts typecheck

  # Playwright smoke tests (web/tests/e2e) against a production build on localhost. Chromium only (both projects,
  # Pixel 7 and Desktop Chrome, run on it). Pages read testnet RPC; the tests accept error states if it's down.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm -C web exec playwright install --with-deps chromium
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - run: pnpm -C web build
      - name: start the app and wait for it
        run: |
          (pnpm -C web start -p 3000 > /tmp/next.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/ && exit 0; sleep 1; done
          cat /tmp/next.log; exit 1
      - run: pnpm -C web test:e2e --trace off
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
      - if: failure()
        run: cat /tmp/next.log || true

  # Secret scan of the full history (gitleaks). On pull requests the action reads the PR's commits.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
