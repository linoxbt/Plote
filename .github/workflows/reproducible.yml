# Reproducible contract builds (docs/LAUNCH.md §3). Builds the estate and unit contracts inside the Docker image pinned
# by digest in each Cargo.toml and prints their SHA-256 and NEAR code hashes, so anyone can compare them with what is
# deployed (`view_account` → code_hash). Run it on the commit you are about to deploy.
# It also checks the estate WASM against the pinned hash in config/estate-wasm.sha256 (the artifact the live estates
# run) and fails on a mismatch: after a reviewed contract change, deploy the new artifact and update that file in the
# same commit (instructions in the file and in the failure message).
name: reproducible-build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "contracts/**"
      - "config/estate-wasm.sha256"
      - ".github/workflows/reproducible.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-near --locked --no-default-features
      - name: reproducible builds
        run: |
          for c in estate unit; do
            cargo near build reproducible-wasm --manifest-path contracts/$c/Cargo.toml
          done
      - name: hashes
        run: |
          python3 - <<'EOF'
          import hashlib, glob
          A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          def b58(b):
              n, s = int.from_bytes(b, "big"), ""
              while n:
                  n, r = divmod(n, 58); s = A[r] + s
              return s
          with open("hashes.txt", "w") as out:
              for f in sorted(glob.glob("target/near/plote_*/plote_*.wasm")):
                  d = hashlib.sha256(open(f, "rb").read()).digest()
                  line = f"{f}  sha256={d.hex()}  code_hash={b58(d)}"
                  print(line); out.write(line + "\n")
          EOF
      - name: compare the deployed estate build with config/estate-wasm.sha256
        # The WASM embeds its source revision (NEP-330), so the pinned artifact is rebuilt at the pinned revision, and
        # the contract sources at HEAD must be identical to that revision (otherwise a new reviewed build is due).
        run: |
          pinned=$(grep -v '^[[:space:]]*#' config/estate-wasm.sha256 | grep -Eo '^[0-9a-f]{64}' | head -n1)
          rev=$(grep -Eo '^rev [0-9a-f]{40}' config/estate-wasm.sha256 | cut -d' ' -f2)
          echo "pinned estate sha256: ${pinned:-<none>} at rev ${rev:-<none>}"
          if [ -z "$pinned" ] || [ -z "$rev" ]; then echo "::error file=config/estate-wasm.sha256::needs a sha256 line and a 'rev <commit>' line"; exit 1; fi
          if ! git diff --quiet "$rev" HEAD -- contracts/estate contracts/unit Cargo.lock Cargo.toml; then
            echo "::error file=config/estate-wasm.sha256::Contract sources changed since the deployed build ($rev)."
            echo "Build this commit reproducibly, deploy it (scripts/upgrade-estate-code.ts --expected-hash <sha256>), then set the sha256 and rev in config/estate-wasm.sha256."
            exit 1
          fi
          git worktree add /tmp/pinned "$rev"
          (cd /tmp/pinned && cargo near build reproducible-wasm --manifest-path contracts/estate/Cargo.toml)
          built=$(sha256sum /tmp/pinned/target/near/plote_estate/plote_estate.wasm | cut -d' ' -f1)
          echo "rebuilt estate sha256: $built"
          if [ "$built" != "$pinned" ]; then
            echo "::error file=config/estate-wasm.sha256::The reproducible build of $rev ($built) is not the pinned artifact ($pinned)."
            exit 1
          fi
          echo "OK: HEAD's contracts are the deployed sources, and their reproducible build is the pinned artifact."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reproducible-wasm
          path: |
            target/near/plote_estate/plote_estate.wasm
            target/near/plote_unit/plote_unit.wasm
            hashes.txt
